[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "testshed"
description = "🧪 The support crew for your test bench"
requires-python = ">=3.11"
authors = [{ name = "Dov Benyomin Sohacheski", email = "b@kloud.email" }]
license = "MIT"
keywords = [
  "kloudkit",
  "pytest",
  "pytest-plugin",
  "docker",
  "playwright",
  "integration-testing",
  "testing",
  "python",
]
classifiers = [
  "Framework :: Pytest",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "playwright==1.65.1",
  "pytest>=9.2.0",
  "python-on-whales>=0.81.0,<1.0.0",
  "PyYAML>=6.0.3,<7.0.0",
  "requests>=2.34.2,<3.0.0",
]
dynamic = ["readme", "version"]

[project.urls]
"Homepage" = "https://github.com/kloudkit/testshed"
"Bug Tracker" = "https://github.com/kloudkit/testshed/issues"
"Source Code" = "https://github.com/kloudkit/testshed"

[dependency-groups]
dev = [
  "ruff>=0.17.5",
  "coverage>=7.17.3",
  "pytest-cov>=7.1.0",
  "prek>=0.5.9",
]

[project.entry-points.pytest11]
testshed = "kloudkit.testshed.plugin"

[tool.setuptools.dynamic]
readme = { file = ["README.md"], content-type = "text/markdown" }
version = { attr = "kloudkit.testshed.__version__" }

[tool.pytest.ini_options]
addopts = "--strict-markers --verbosity=1"
testpaths = ["tests"]
filterwarnings = ["error"]
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"

[tool.coverage.run]
source = ["kloudkit.testshed"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*"
]

[tool.coverage.report]
exclude_lines = [
    "@(abc\\.)?abstractmethod",
    "# pragma: no cover",
    "if __name__ == .__main__.:",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError"
]
show_missing = true
precision = 2
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"
