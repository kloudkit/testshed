---
name: 🔖 Publish New Tag

on:
  push:
    branches:
      - main
    paths:
      - src/kloudkit/testshed/__init__.py

permissions:
  contents: write

jobs:
  tag:
    name: 🔖 Tag
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🔢 Extract version from __init__.py
        id: version
        run: |-
          VERSION=$(grep -oP '__version__ = "\K[^"]+' src/kloudkit/testshed/__init__.py)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # ls-remote exits 0 when the tag exists and 2 when it doesn't; anything else is an error.
      - name: 🧪 Check if tag exists
        id: check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null || rc=$?

          case $rc in
            0) echo "Tag $TAG already exists on origin. Skipping."; echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac

      - name: 🔖 Create and push tag
        if: steps.check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
