---
name: 🚀 Release

# Kept as publish.yaml: PyPI's trusted publisher is registered for this file name.
on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: 🧪 CI
    uses: ./.github/workflows/ci.yaml

  publish:
    name: 🚀 Release
    runs-on: ubuntu-latest
    environment: release
    needs:
      - ci

    permissions:
      contents: write
      id-token: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🔢 Check the tag matches __version__
        run: |
          VERSION=$(grep -oP '__version__ = "\K[^"]+' src/kloudkit/testshed/__init__.py)

          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $VERSION"
            exit 1
          fi

      - name: 📝 Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"

          cat >> "$RUNNER_TEMP/notes.md" <<NOTES

          ## Install

          \`\`\`sh
          pip install testshed==$VERSION
          # or
          uv add testshed==$VERSION --group dev
          \`\`\`
          NOTES

      - name: 🕶 Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: 🏗️ Build package
        run: uv build

      - name: 📤 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: 🔖 Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
